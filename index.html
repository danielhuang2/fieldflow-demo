  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;fieldflow-phone-demo&#x27;);
      const stored = window.openai &amp;&amp; window.openai.widgetState &amp;&amp; window.openai.widgetState.modelContent;
      const state = Object.assign({ delay: 30, inputChange: 8, household: 8, credit: 150, selected: 7 }, stored &amp;&amp; typeof stored === &#x27;object&#x27; ? stored : {});
      const design = { accent: &#x27;#2f6f4e&#x27;, corners: 17, alertStyle: &#x27;Warm&#x27; };
      const months = [&#x27;Oct&#x27;,&#x27;Nov&#x27;,&#x27;Dec&#x27;,&#x27;Jan&#x27;,&#x27;Feb&#x27;,&#x27;Mar&#x27;,&#x27;Apr&#x27;,&#x27;May&#x27;,&#x27;Jun&#x27;,&#x27;Jul&#x27;,&#x27;Aug&#x27;,&#x27;Sep&#x27;];
      const revenues = [40,20,10,15,25,40,70,160,320,260,190,100];
      const inputs = [80,85,55,35,40,95,110,70,55,45,50,70];
      const payroll = [20,20,20,20,20,22,22,22,22,22,22,22];
      const debt = [0,0,35,0,0,40,0,0,40,0,0,40];
      const reserve = 75, opening = 350;
      const q = s =&gt; root.querySelector(s);
      const fmt = (v, plus) =&gt; (plus &amp;&amp; v &gt; 0 ? &#x27;+&#x27; : v &lt; 0 ? &#x27;−&#x27; : &#x27;&#x27;) + &#x27;$&#x27; + Math.abs(Math.round(v)) + &#x27;k&#x27;;

      function data() {
        const receipts = revenues.slice();
        const move = state.delay === 0 ? 0 : state.delay === 15 ? 40 : state.delay === 30 ? 90 : state.delay === 45 ? 125 : 160;
        receipts[7] -= move;
        receipts[Math.min(11, 7 + Math.ceil(state.delay / 30))] += move;
        let cash = opening;
        return months.map((month, i) =&gt; {
          const input = inputs[i] * (1 + state.inputChange / 100);
          const other = payroll[i] + debt[i] + state.household;
          const net = receipts[i] - input - other;
          cash += net;
          return { month, receipts: receipts[i], input, other, net, cash };
        });
      }

      function color(token) { return getComputedStyle(root).getPropertyValue(token).trim(); }

      function draw(rows) {
        const svg = q(&#x27;#fp-chart&#x27;);
        const width = Math.max(320, svg.clientWidth || 350), height = 184;
        const m = { l: 39, r: 15, t: 17, b: 28 }, iw = width - m.l - m.r, ih = height - m.t - m.b;
        const vals = rows.map(d =&gt; d.cash).concat([reserve, 0]);
        const min = Math.floor((Math.min(...vals) - 25) / 100) * 100, max = Math.ceil((Math.max(...vals) + 25) / 100) * 100;
        const x = i =&gt; m.l + iw * i / 11, y = v =&gt; m.t + (max - v) / (max - min) * ih;
        const points = rows.map((d, i) =&gt; [x(i), y(d.cash)]);
        const path = points.map((p, i) =&gt; `${i ? &#x27;L&#x27; : &#x27;M&#x27;}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(&#x27; &#x27;);
        const line = color(&#x27;--fp-line&#x27;), muted = color(&#x27;--fp-muted&#x27;), accent = color(&#x27;--fp-accent&#x27;), warning = color(&#x27;--fp-warning&#x27;), danger = color(&#x27;--fp-danger&#x27;), surface = color(&#x27;--fp-surface&#x27;);
        let h = &#x27;&lt;title&gt;Seasonal cash outlook&lt;/title&gt;&lt;desc&gt;Projected cash drops below the reserve before recovering after harvest receipts.&lt;/desc&gt;&#x27;;
        [-200,0,200].filter(v =&gt; v &gt;= min &amp;&amp; v &lt;= max).forEach(v =&gt; { h += `&lt;line x1=&quot;${m.l}&quot; x2=&quot;${width-m.r}&quot; y1=&quot;${y(v)}&quot; y2=&quot;${y(v)}&quot; stroke=&quot;${line}&quot;/&gt;&lt;text x=&quot;${m.l-7}&quot; y=&quot;${y(v)+4}&quot; text-anchor=&quot;end&quot; fill=&quot;${muted}&quot; font-size=&quot;10&quot;&gt;${v &lt; 0 ? &#x27;−&#x27; : &#x27;&#x27;}$${Math.abs(v)}&lt;/text&gt;`; });
        h += `&lt;line x1=&quot;${m.l}&quot; x2=&quot;${width-m.r}&quot; y1=&quot;${y(reserve)}&quot; y2=&quot;${y(reserve)}&quot; stroke=&quot;${warning}&quot; stroke-dasharray=&quot;4 4&quot;/&gt;&lt;path d=&quot;${path}&quot; fill=&quot;none&quot; stroke=&quot;${accent}&quot; stroke-width=&quot;3&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/&gt;`;
        [0,3,6,9,11].forEach(i =&gt; { h += `&lt;text x=&quot;${x(i)}&quot; y=&quot;${height-7}&quot; text-anchor=&quot;${i===0?&#x27;start&#x27;:i===11?&#x27;end&#x27;:&#x27;middle&#x27;}&quot; fill=&quot;${muted}&quot; font-size=&quot;10&quot;&gt;${months[i]}&lt;/text&gt;`; });
        points.forEach((p,i) =&gt; { const c = rows[i].cash &lt; 0 ? danger : rows[i].cash &lt; reserve ? warning : accent; h += `&lt;circle cx=&quot;${p[0]}&quot; cy=&quot;${p[1]}&quot; r=&quot;${i===state.selected?6:4}&quot; fill=&quot;${surface}&quot; stroke=&quot;${c}&quot; stroke-width=&quot;${i===state.selected?3:2}&quot;/&gt;&lt;circle cx=&quot;${p[0]}&quot; cy=&quot;${p[1]}&quot; r=&quot;20&quot; fill=&quot;transparent&quot; data-index=&quot;${i}&quot;/&gt;`; });
        svg.setAttribute(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`); svg.innerHTML = h;
        svg.querySelectorAll(&#x27;[data-index]&#x27;).forEach(hit =&gt; hit.addEventListener(&#x27;click&#x27;, () =&gt; { state.selected = Number(hit.dataset.index); save(); render(); }));
      }

      function summary(rows) {
        const first = rows.find(d =&gt; d.cash &lt; reserve), tight = rows.reduce((a,b) =&gt; a.cash &lt; b.cash ? a : b), uncovered = Math.max(0, -tight.cash - state.credit);
        return `Cash drops below the $75k reserve in ${first.month}. The low point is ${fmt(tight.cash)} in ${tight.month}. With a ${fmt(state.credit)} operating line, ${uncovered ? fmt(uncovered) + &#x27; remains uncovered&#x27; : &#x27;the timing gap is covered&#x27;}. Grain payment delay: ${state.delay} days. Input cost change: ${state.inputChange &gt;= 0 ? &#x27;+&#x27; : &#x27;&#x27;}${state.inputChange}%.`;
      }

      function render() {
        root.style.setProperty(&#x27;--fp-accent&#x27;, design.accent);
        root.querySelector(&#x27;.fp-phone&#x27;).style.setProperty(&#x27;--fp-card-radius&#x27;, design.corners + &#x27;px&#x27;);
        const rows = data(), tight = rows.reduce((a,b) =&gt; a.cash &lt; b.cash ? a : b), first = rows.find(d =&gt; d.cash &lt; reserve), selected = rows[state.selected], uncovered = Math.max(0, -tight.cash - state.credit);
        q(&#x27;#fp-alert-title&#x27;).textContent = `${tight.month} is your tightest month`;
        q(&#x27;#fp-alert-number&#x27;).textContent = fmt(tight.cash);
        q(&#x27;#fp-alert-copy&#x27;).textContent = uncovered ? `Your ${fmt(state.credit)} operating line leaves ${fmt(uncovered)} uncovered.` : `Your ${fmt(state.credit)} operating line covers the timing gap.`;
        q(&#x27;#fp-first-risk&#x27;).textContent = first ? `Below reserve ${first.month}` : &#x27;Above reserve&#x27;;
        q(&#x27;#fp-selected&#x27;).innerHTML = `&lt;div&gt;&lt;strong&gt;${selected.month} ending cash&lt;/strong&gt;&lt;span&gt;Tap another point to inspect that month&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;fp-selected-value&quot;&gt;${fmt(selected.cash)}&lt;/div&gt;`;
        q(&#x27;#fp-month-name&#x27;).textContent = `${selected.month} detail`;
        q(&#x27;#fp-month-note&#x27;).textContent = selected.month === &#x27;May&#x27; &amp;&amp; state.delay ? &#x27;Grain receipt delayed to a later month&#x27; : selected.net &lt; 0 ? &#x27;Cash needs exceed receipts&#x27; : &#x27;Receipts rebuild cash&#x27;;
